<svg width="400" height="480" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="480" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Title -->
  <text x="200" y="35" fill="#1E40AF" font-size="18" font-weight="700" font-family="system-ui" text-anchor="middle">Diversified Research Index</text>
  <text x="200" y="55" fill="#64748B" font-size="12" font-family="system-ui" text-anchor="middle">Academic Publishing Portfolio</text>
  
  <!-- Stacked articles visualization (like index fund holdings) -->
  <g transform="translate(40, 80)">
    <!-- Article stack layer 1 - Physics -->
    <rect x="0" y="0" width="320" height="50" fill="#3B82F6" opacity="0.9" rx="4"/>
    <text x="10" y="25" fill="white" font-size="13" font-weight="600" font-family="system-ui">Physics Research</text>
    <text x="10" y="40" fill="#E0E7FF" font-size="10" font-family="system-ui">25 Articles • $37,500</text>
    <text x="305" y="30" fill="white" font-size="14" font-weight="700" font-family="system-ui" text-anchor="end">25%</text>
    
    <!-- Layer 2 - Biology -->
    <rect x="0" y="55" width="256" height="50" fill="#8B5CF6" opacity="0.9" rx="4"/>
    <text x="10" y="80" fill="white" font-size="13" font-weight="600" font-family="system-ui">Biology Research</text>
    <text x="10" y="95" fill="#F3E8FF" font-size="10" font-family="system-ui">20 Articles • $30,000</text>
    <text x="241" y="85" fill="white" font-size="14" font-weight="700" font-family="system-ui" text-anchor="end">20%</text>
    
    <!-- Layer 3 - Chemistry -->
    <rect x="0" y="110" width="224" height="50" fill="#06B6D4" opacity="0.9" rx="4"/>
    <text x="10" y="135" fill="white" font-size="13" font-weight="600" font-family="system-ui">Chemistry Research</text>
    <text x="10" y="150" fill="#CFFAFE" font-size="10" font-family="system-ui">18 Articles • $27,000</text>
    <text x="209" y="140" fill="white" font-size="14" font-weight="700" font-family="system-ui" text-anchor="end">18%</text>
    
    <!-- Layer 4 - Medicine -->
    <rect x="0" y="165" width="192" height="50" fill="#10B981" opacity="0.9" rx="4"/>
    <text x="10" y="190" fill="white" font-size="13" font-weight="600" font-family="system-ui">Medicine Research</text>
    <text x="10" y="205" fill="#D1FAE5" font-size="10" font-family="system-ui">15 Articles • $22,500</text>
    <text x="177" y="195" fill="white" font-size="14" font-weight="700" font-family="system-ui" text-anchor="end">15%</text>
    
    <!-- Layer 5 - Other -->
    <rect x="0" y="220" width="140" height="50" fill="#64748B" opacity="0.9" rx="4"/>
    <text x="10" y="245" fill="white" font-size="13" font-weight="600" font-family="system-ui">Other Fields</text>
    <text x="10" y="260" fill="#E2E8F0" font-size="10" font-family="system-ui">22 Articles • $33,000</text>
    <text x="125" y="250" fill="white" font-size="14" font-weight="700" font-family="system-ui" text-anchor="end">22%</text>
  </g>
  
  <!-- Performance chart -->
  <g transform="translate(40, 375)">
    <text x="0" y="0" fill="#1E293B" font-size="13" font-weight="600" font-family="system-ui">Portfolio Growth</text>
    
    <!-- Chart area -->
    <rect x="0" y="10" width="320" height="70" fill="white" opacity="0.7" rx="4"/>
    
    <!-- Growth line -->
    <polyline 
      points="10,65 50,60 90,55 130,50 170,48 210,40 250,35 290,25 310,20" 
      fill="none" 
      stroke="#3B82F6" 
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Area under line -->
    <polygon 
      points="10,65 50,60 90,55 130,50 170,48 210,40 250,35 290,25 310,20 310,80 10,80" 
      fill="url(#chartGrad)" 
      opacity="0.3"
    />
    
    <!-- Data points -->
    <circle cx="10" cy="65" r="3" fill="#3B82F6"/>
    <circle cx="90" cy="55" r="3" fill="#3B82F6"/>
    <circle cx="170" cy="48" r="3" fill="#3B82F6"/>
    <circle cx="250" cy="35" r="3" fill="#3B82F6"/>
    <circle cx="310" cy="20" r="3" fill="#3B82F6"/>
    
    <!-- Growth percentage -->
    <text x="320" y="25" fill="#10B981" font-size="16" font-weight="700" font-family="system-ui" text-anchor="end">+42%</text>
  </g>
  
  <!-- Bottom stats -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="320" height="1" fill="#CBD5E1"/>
  </g>
  
  <!-- Key metrics -->
  <g transform="translate(40, 468)">
    <text x="0" y="0" fill="#64748B" font-size="10" font-family="system-ui">100 Articles</text>
    <text x="90" y="0" fill="#64748B" font-size="10" font-family="system-ui">$150,000 Total</text>
    <text x="320" y="0" fill="#10B981" font-size="10" font-weight="600" font-family="system-ui" text-anchor="end">Diversified</text>
  </g>
</svg>
