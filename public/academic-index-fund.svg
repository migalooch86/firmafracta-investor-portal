<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <!-- Dark Background -->
  <rect width="500" height="600" fill="#0f172a"/>
  
  <!-- Header Section -->
  <g>
    <rect x="20" y="20" width="460" height="80" fill="#1e293b" rx="8"/>
    <text x="40" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Academic Research Index Fund</text>
    <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">ARIF • Diversified Portfolio</text>
    
    <!-- Performance Badge -->
    <rect x="380" y="35" width="80" height="32" fill="#10b981" rx="6"/>
    <text x="420" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">+42.8%</text>
  </g>
  
  <!-- Key Metrics -->
  <g transform="translate(20, 120)">
    <rect width="220" height="85" fill="#1e293b" rx="8"/>
    <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TOTAL ASSETS</text>
    <text x="15" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">$18.6M</text>
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981">↑ 8.2% YTD</text>
  </g>
  
  <g transform="translate(260, 120)">
    <rect width="220" height="85" fill="#1e293b" rx="8"/>
    <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">DIVIDEND YIELD</text>
    <text x="15" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">5.4%</text>
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Quarterly Distribution</text>
  </g>
  
  <!-- Allocation Section -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Sector Allocation</text>
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">500 articles across 5 disciplines</text>
    
    <!-- Physics -->
    <g transform="translate(0, 40)">
      <rect width="460" height="60" fill="#1e293b" rx="6"/>
      <rect x="0" y="0" width="345" height="60" fill="#3b82f6" rx="6" opacity="0.15"/>
      <rect x="0" y="0" width="8" height="60" fill="#3b82f6" rx="2"/>
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Physics & Astronomy</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">125 articles • $4.65M</text>
      <text x="440" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#3b82f6" text-anchor="end">25%</text>
    </g>
    
    <!-- Biology -->
    <g transform="translate(0, 110)">
      <rect width="460" height="60" fill="#1e293b" rx="6"/>
      <rect x="0" y="0" width="276" height="60" fill="#8b5cf6" rx="6" opacity="0.15"/>
      <rect x="0" y="0" width="8" height="60" fill="#8b5cf6" rx="2"/>
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Molecular Biology</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">100 articles • $3.72M</text>
      <text x="440" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#8b5cf6" text-anchor="end">20%</text>
    </g>
    
    <!-- Chemistry -->
    <g transform="translate(0, 180)">
      <rect width="460" height="60" fill="#1e293b" rx="6"/>
      <rect x="0" y="0" width="248" height="60" fill="#06b6d4" rx="6" opacity="0.15"/>
      <rect x="0" y="0" width="8" height="60" fill="#06b6d4" rx="2"/>
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Chemistry</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">90 articles • $3.35M</text>
      <text x="440" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#06b6d4" text-anchor="end">18%</text>
    </g>
    
    <!-- Medicine -->
    <g transform="translate(0, 250)">
      <rect width="460" height="60" fill="#1e293b" rx="6"/>
      <rect x="0" y="0" width="207" height="60" fill="#10b981" rx="6" opacity="0.15"/>
      <rect x="0" y="0" width="8" height="60" fill="#10b981" rx="2"/>
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Medical Research</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">75 articles • $2.79M</text>
      <text x="440" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#10b981" text-anchor="end">15%</text>
    </g>
    
    <!-- Other -->
    <g transform="translate(0, 320)">
      <rect width="460" height="60" fill="#1e293b" rx="6"/>
      <rect x="0" y="0" width="303" height="60" fill="#64748b" rx="6" opacity="0.15"/>
      <rect x="0" y="0" width="8" height="60" fill="#64748b" rx="2"/>
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Other Disciplines</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">110 articles • $4.09M</text>
      <text x="440" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#64748b" text-anchor="end">22%</text>
    </g>
  </g>
</svg>
