    <!-- Right page -->
    <path d="M36 8C36 8 32 6 28 6C24 6 20 8 20 8V32C20 32 24 30 28 30C32 30 36 32 36 32V8Z" 
          fill="#60A5FA" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Book spine -->
