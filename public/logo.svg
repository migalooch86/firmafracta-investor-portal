    <line x1="8" y1="16" x2="16" y2="16" stroke="#E0E7FF" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="16" y2="20" stroke="#E0E7FF" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Decorative lines on right page -->
    <line x1="24" y1="12" x2="32" y2="12" stroke="#DBEAFE" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="16" x2="32" y2="16" stroke="#DBEAFE" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="20" x2="32" y2="20" stroke="#DBEAFE" stroke-width="1" stroke-linecap="round"/>
  </g>
